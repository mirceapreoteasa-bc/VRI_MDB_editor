[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vri-validator"
version = "0.3.2"
description = "Validator and derived-field recalculation for BC VRI/VRIMS personal geodatabases"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
vri-validate = "vri_validator.cli:main"
vri-validate-install-launcher = "vri_validator.launcher:main"

[project.gui-scripts]
vri-validate-gui = "vri_validator.gui:main"

[project.optional-dependencies]
test = []

[tool.setuptools]
packages = ["vri_validator", "vri_validator.rules"]
include-package-data = true

[tool.setuptools.package-data]
vri_validator = ["data/*.xml", "data/*.json", "data/*.png", "data/*.svg", "data/jars/*.jar"]
